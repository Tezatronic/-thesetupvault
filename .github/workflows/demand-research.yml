name: Demand Engine Research (Phase 1 Pilot)

# Deliberately workflow_dispatch ONLY — no schedule. Per the Phase 1 brief,
# this pilot must not run automatically or on any cadence; it runs only when
# explicitly triggered, so a batch can be reviewed before another is
# generated. It never touches used-angles.json, dynamic-angles.json,
# dynamic-pointer.json, or src/content/blog — it only reads/writes
# scripts/opportunity-pool.json and scripts/demand-research-log.jsonl.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run demand research (Phase 1 pilot)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/demand-research.mjs

      - name: Commit opportunity pool + log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/opportunity-pool.json scripts/demand-research-log.jsonl
          git diff --cached --quiet || git commit -m "chore: demand engine research run"
          git push
