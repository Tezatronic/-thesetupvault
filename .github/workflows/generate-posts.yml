name: Generate SEO Blog Post

on:
  schedule:
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Commit and push new post
        id: commit
        run: |
          git config user.name "setup-vault-bot"
          git config user.email "setup-vault-bot@users.noreply.github.com"
          git add src/content/blog scripts/used-angles.json scripts/dynamic-angles.json scripts/dynamic-pointer.json scripts/dynamic-angle-log.jsonl
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-generate blog post"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Tell Bing (via IndexNow) about the new post once the Vercel deploy is live.
      # Fail-soft by design: a failed ping must never fail or block publishing.
      - name: Notify IndexNow
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs --from-git
